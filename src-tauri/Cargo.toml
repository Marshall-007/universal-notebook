[package]
name = "universal-notebook"
version = "1.0.0"
description = "Universal Notebook - Cross-platform note-taking app"
authors = ["you"]
edition = "2021"

[lib]
name = "universal_notebook_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
