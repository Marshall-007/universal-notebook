name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            V=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          tagName: ${{ steps.rel.outputs.tag }}
          releaseName: 'Universal Notebook ${{ steps.rel.outputs.tag }}'
          releaseBody: 'Download the installer for your platform below.'
          releaseDraft: true

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --ignore-scripts && npm rebuild

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-notebook-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Attach the APK to the same draft release the desktop job created. Runs after
  # build-desktop so the release already exists (no create race), and works for
  # both tag pushes and manual workflow_dispatch runs.
  attach-apk:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            V=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: universal-notebook-android
          path: apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.rel.outputs.tag }}
          files: apk/app-debug.apk
